version: '3.9'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend_net

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - backend_net
      - app_net

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    networks:
      - app_net

  gateway:
    build: ./gateway
    ports:
      - "8888:80"
    depends_on:
      - frontend
      - backend
    networks:
      - app_net

networks:
  backend_net:
  app_net:
